name: "Hikvision Relay"
description: "Direct alarm output control for Hikvision DS-KH6320-WTE1 via binary SDK (port 8000)"
version: "1.0.0"
slug: "hikvision-relay"
url: "https://github.com/zbigniew-holdys/HikRelayAddon"
init: false

arch:
  - aarch64
  - amd64

ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Relay HTTP API"

options:
  relay_host: "192.168.1.100"
  relay_port: 8000
  relay_user: "admin"
  relay_pass: ""
  relay_0_name: "Gate"
  relay_1_name: "Garage"

schema:
  relay_host: str
  relay_port: int
  relay_user: str
  relay_pass: str
  relay_0_name: str
  relay_1_name: str
